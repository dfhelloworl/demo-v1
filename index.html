<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI涨乐 清洁版手机 Demo v2.0</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="demo-shell">
    <section class="phone-wrap" aria-label="iPhone 手机原型">
      <div class="iphone">
        <div class="island"></div>
        <div class="screen" id="phoneScreen">
          <section class="kyc-screen" id="kycScreen" aria-label="首页定制">
            <div class="kyc-content">
              <div class="kyc-hero">
                <div class="kyc-kicker"><i></i> AI 工作区生成中</div>
                <h1>选择你的投资方式</h1>
                <p>AI 将按你的关注重点，生成专属首页与常用能力。</p>
                <div class="kyc-signal" aria-hidden="true">
                  <div class="signal-core"><b>AI</b><span>画像匹配</span></div>
                  <i></i><i></i><i></i>
                </div>
              </div>
              <div class="kyc-section-head">
                <strong>你更接近哪一类？</strong>
                <span>随时可调整</span>
              </div>
              <div class="kyc-grid">
                <button class="kyc-card kyc-newbie" type="button">
                  <i class="kyc-card-icon" aria-hidden="true"></i>
                  <em>稳健入门</em>
                  <strong>小白用户</strong>
                  <span>从基础行情和解释开始</span>
                </button>
                <button class="kyc-card kyc-short" type="button">
                  <i class="kyc-card-icon" aria-hidden="true"></i>
                  <em>高频洞察</em>
                  <strong>短线用户</strong>
                  <span>关注异动、信号、交易机会</span>
                </button>
                <button class="kyc-card kyc-wealth" type="button">
                  <i class="kyc-card-icon" aria-hidden="true"></i>
                  <em>长期配置</em>
                  <strong>理财用户</strong>
                  <span>看账户、收益和资产配置</span>
                </button>
                <button class="kyc-card kyc-custom" type="button">
                  <i class="kyc-card-icon" aria-hidden="true"></i>
                  <em>自由搭建</em>
                  <strong>自定义</strong>
                  <span>告诉我你的需求或上传截图</span>
                </button>
              </div>
              <div class="kyc-footer"><i></i> 已为你准备 12 种智能能力</div>
            </div>
          </section>
          <div class="scroll-area" id="scrollArea">
            <img id="screenImage" alt="AI涨乐页面" draggable="false" />
            <div class="confirm-card" id="confirmCard" hidden>
              <img src="./assets/images/guide layout.png" alt="确认" draggable="false" />
              <div class="confirm-actions">
                <button type="button" class="btn-recommend">使用推荐</button>
                <button type="button" class="btn-customize">去定制</button>
              </div>
            </div>
            <div class="hotspots" id="hotspots"></div>
          </div>
          <div class="bottom-bar" id="bottomBar">
              <button class="nav-item" type="button" data-nav="market" aria-label="大盘">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <button class="nav-item" type="button" data-nav="watchlist" aria-label="自选">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <button class="nav-item" type="button" data-nav="watch" aria-label="资讯">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <button class="nav-item" type="button" data-nav="chat" aria-label="长按说话">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <button class="nav-item" type="button" data-nav="trans" aria-label="交易">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <button class="nav-item" type="button" data-nav="more" aria-label="更多">
                <img data-role="icon" alt="" draggable="false" />
              </button>
              <div class="fixed-hotspots" id="fixedHotspots"></div>
            </div>
          <div class="guide-layer" id="guideLayer" aria-hidden="true">
            <div class="guide-target"></div>
            <div class="guide-hand">
              <span class="finger"></span>
              <span class="palm"></span>
            </div>
          </div>
          <div class="chat-interaction" id="chatInteraction" aria-hidden="true">
            <div class="home-card-mask" id="homeCardMask" aria-hidden="true"></div>
            <button class="chat-menu-hit" id="chatMenuBtn" type="button" aria-label="打开侧边栏"></button>

            <section class="chat-stream" id="chatStream" aria-label="对话流"></section>

            <section class="chat-tabs" aria-label="技能栏">
              <div class="chat-tabs-inner" style="display:flex; height:100%; align-items:center;">
                <button class="chat-chip selected" type="button" data-tab="分析" aria-label="分析">
                  <svg viewBox="0 0 16 16" width="12" height="12"><rect x="3" y="2" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="6" x2="6" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  <span>分析</span>
                </button>
                <button class="chat-chip" type="button" data-tab="选股" aria-label="选股">
                  <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 2L14 8L8 14L2 8L8 2Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                  <span>选股</span>
                </button>
                <button class="chat-chip" type="button" data-tab="盯盘" aria-label="盯盘">
                  <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                  <span>盯盘</span>
                </button>
                <button class="chat-chip" type="button" data-tab="交易" aria-label="交易">
                  <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 12L12 4M12 4H6M12 4V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <span>交易</span>
                </button>
                <button class="chat-chip" type="button" data-tab="定时" aria-label="定时">
                  <svg viewBox="0 0 16 16" width="12" height="12"><rect x="3" y="2" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="6" x2="6" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  <span>定时</span>
                </button>
                <button class="chat-chip" type="button" data-tab="复杂任务" aria-label="复杂任务">
                  <svg viewBox="0 0 16 16" width="12" height="12"><rect x="3" y="2" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="6" x2="6" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  <span>复杂任务</span>
                </button>
              </div>
            </section>

            <section class="chat-input-bar" id="chatInputBar" aria-label="输入栏">
              <div class="voice-label" id="voiceLabel">🎤 按住说话</div>
              <div class="chat-input-wrap" id="chatInputWrap">
                <div class="input-attachments" id="inputAttachments"></div>
                <textarea class="chat-input" id="chatInput" placeholder="请输入内容..."></textarea>
                <div class="prompt-suggest" id="promptSuggest">
                  <button class="prompt-chip" type="button" data-prompt="利好利空">利好利空</button>
                  <button class="prompt-chip" type="button" data-prompt="AI求真">AI求真</button>
                  <button class="prompt-chip" type="button" data-prompt="分析一下 K 线">分析一下 K 线</button>
                </div>
              </div>
              <div class="chat-input-actions">
                <button class="round-action" id="keyboardToggle" type="button" aria-label="切换键盘">
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="14" rx="2.5" />
                    <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
                  </svg>
                </button>
                <button class="round-action" id="plusEntryBtn" type="button" aria-label="添加">＋</button>
              </div>
            </section>

            <section class="plus-panel" id="plusPanel" aria-hidden="true">
              <div class="multi-actions">
                <button type="button">📷<span>相机</span></button>
                <button type="button">🖼️<span>照片</span></button>
                <button type="button">📄<span>文件</span></button>
                <button type="button">🔗<span>链接</span></button>
              </div>
              <p>最近图片</p>
              <div class="recent-grid" id="recentGrid">
                <button class="recent-thumb kline" type="button" data-image="K线截图"
                  data-type="kline"><span>×</span></button>
                <button class="recent-thumb news" type="button" data-image="财经新闻截图"
                  data-type="news"><span>×</span></button>
                <button class="recent-thumb stock-list" type="button" data-image="股票列表截图"
                  data-type="stock-list"><span>×</span></button>
              </div>
              <button class="add-images-btn" id="addImagesBtn" type="button" disabled>添加图片</button>
            </section>

            <section class="scenario-sheet" id="scenarioSheet" aria-hidden="true">
              <div class="sheet-head">
                <strong id="scenarioTitle">技能</strong>
                <button id="scenarioClose" type="button" aria-label="关闭">×</button>
              </div>
              <p id="scenarioDesc">选择一个场景快速填入指令。</p>
              <div class="scenario-list" id="scenarioList"></div>
            </section>

            <section class="task-edit-sheet" id="taskEditSheet" aria-hidden="true">
              <div class="sheet-head">
                <strong>定时任务设置</strong>
                <button id="taskEditClose" type="button" aria-label="关闭">×</button>
              </div>
              <label>任务内容<textarea id="editTaskContent">生成每日收盘报告，需要分析：大盘走势、板块联动、资金动向</textarea></label>
              <label>执行时间<input id="editTaskTime" value="17:30" /></label>
              <label>执行频率<input id="editTaskFreq" value="每个交易日" /></label>
              <div class="edit-actions">
                <button id="editSubscribe" type="button">订阅定时</button>
                <button id="editRun" type="button">订阅并试运行</button>
              </div>
            </section>

            <div class="fake-keyboard" id="fakeKeyboard" aria-hidden="true">
              <div>Q W E R T Y U I O P</div>
              <div>A S D F G H J K L</div>
              <div>⇧ Z X C V B N M ⌫</div>
              <div>123　　　　　space　　　　　完成</div>
            </div>
          </div>
          <div class="more-menu" id="moreMenu" hidden>
            <button class="more-menu-backdrop" type="button" aria-label="关闭更多菜单"></button>
            <section class="more-menu-sheet" aria-label="更多菜单">
              <header class="more-menu-head">
                <button class="more-menu-close" type="button" aria-label="关闭"></button>
                <strong>更多</strong>
                <button class="more-menu-close" type="button" aria-label="关闭">×</button>
              </header>
              <div class="more-menu-grid">
                <button class="more-menu-item" type="button">
                  <span class="more-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
                  </span>
                  <span>账户</span>
                </button>
                <button class="more-menu-item" type="button">
                  <span class="more-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="8" width="14" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M9 13h6"/></svg>
                  </span>
                  <span>AI交易员</span>
                </button>
                <button class="more-menu-item" type="button">
                  <span class="more-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
                  </span>
                  <span>任务助手</span>
                </button>
                <button class="more-menu-item" type="button">
                  <span class="more-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4a5 5 0 0 1 5 5v1h1a2 2 0 0 1 2 2v6H4v-6a2 2 0 0 1 2-2h1V9a5 5 0 0 1 5-5z"/></svg>
                  </span>
                  <span>特别提醒</span>
                </button>
                <button class="more-menu-item" type="button">
                  <span class="more-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12l16-7-7 16-2-7-7-2z"/></svg>
                  </span>
                  <span>我的出招</span>
                </button>
                <button class="more-menu-item more-menu-custom-nav" type="button" aria-label="自定义导航">
                  <span class="more-menu-icon more-menu-icon-add" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 9v6M9 12h6"/></svg>
                  </span>
                  <span>自定义导航</span>
                </button>
              </div>
            </section>
          </div>
          <div class="more-modal" id="moreModal" hidden>
            <button class="more-backdrop" type="button" aria-label="关闭更多"></button>
            <img src="./assets/screens/more.png" alt="更多浮窗" draggable="false" />
            <button class="more-close more-close-left" type="button" aria-label="完成"></button>
            <button class="more-close more-close-right" type="button" aria-label="关闭"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>

</html>
